<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>CineMatch · Scegli la sorgente</title>
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="cinema.css">
<script src="vendor/hls.min.js" defer></script>
<script type="module" src="cinema-app.js"></script>
</head>
<body class="cinema-app">
<header class="cn-topbar">
  <div class="cn-brand" aria-label="CineMatch">
    <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="4" width="17" height="17" rx="4"/><path d="M9 24h12a4 4 0 0 0 4-4V9M9 10h6M9 15h4"/></svg>
    <span>CineMatch</span>
  </div>
  <span class="cn-topbar-title" id="topbarTitle">Scegli come guardarlo</span>
  <button class="cn-ghost" id="manageAddons" type="button">Addon</button>
</header>

<main class="cn-main">
  <section class="cm-picker" id="pickerView" aria-label="Scegli una sorgente">
    <div class="cm-hero">
      <div class="poster-wrap" id="posterWrap">
        <img id="moviePoster" alt="" hidden>
        <span id="posterFallback" aria-hidden="true">CM</span>
      </div>
      <div class="cm-hero-copy">
        <p class="cm-kicker">Sorgenti disponibili</p>
        <h1 id="movieTitle">Caricamento…</h1>
        <p class="cm-original" id="movieOriginal"></p>
        <div class="cm-meta" id="movieMeta"></div>
        <p class="cm-rating" id="movieRating" hidden></p>
        <p class="cm-director" id="movieCredits"></p>
        <div class="cm-hero-actions">
          <button class="cm-primary" id="playBest" type="button" disabled>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
            Riproduci
          </button>
          <button class="cm-resume" id="resumePlay" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
            Riprendi da <span id="resumeTime">0:00</span>
          </button>
          <a class="cm-ghost" id="tmdbLink" href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer" hidden>TMDB</a>
        </div>
        <p class="cm-overview" id="movieOverview"></p>
      </div>
    </div>

    <div class="cm-sources">
      <div class="cm-sources-head">
        <div>
          <h2>Scegli una sorgente</h2>
          <p id="sourcesStatus" role="status" aria-live="polite">Cerco i flussi negli addon…</p>
        </div>
        <div class="cm-source-actions">
          <button class="cm-icon-btn" id="refreshSources" type="button" aria-label="Aggiorna le sorgenti" title="Aggiorna">↻</button>
          <button class="cm-ghost cm-small" id="importJson" type="button">Importa JSON</button>
        </div>
      </div>
      <div class="cm-chips" id="addonChips" role="group" aria-label="Filtra per addon"></div>
      <div class="cm-source-list" id="sourceList"></div>
    </div>
  </section>

  <section class="cm-player-view" id="playerView" hidden>
    <div class="cm-player-main">
      <div class="cm-stage" id="stage" tabindex="-1">
        <video id="video" playsinline preload="metadata" crossorigin="anonymous" aria-label="Player del film"></video>
        <div id="codecScreen" hidden></div>
        <div class="cm-player-loading" id="playerLoading" hidden><i></i><span>Preparo il flusso…</span></div>
        <button class="cm-big-play" id="bigPlay" type="button" hidden aria-label="Riproduci">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
        </button>
        <div class="cm-player-topbar">
          <button class="cm-back" id="backToPicker" type="button">← Film</button>
          <div class="cm-player-title"><strong id="playerTitle">Film</strong><span id="playerSource"></span></div>
          <button class="cm-back" id="openDrawerTop" type="button">Sorgenti</button>
        </div>
        <div class="cm-controls" id="controls">
          <div class="cm-progress"><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Posizione nel video"></div>
          <div class="cm-controls-row">
            <button id="playPause" type="button" aria-label="Riproduci"></button>
            <span class="cm-time" id="time">0:00 / 0:00</span>
            <span class="cm-spacer"></span>
            <button id="mute" type="button" aria-label="Disattiva audio"></button>
            <label class="cm-volume"><span class="sr-only">Volume</span><input id="volume" type="range" min="0" max="1" step="0.05" value="1"></label>
            <label class="cm-track" id="audioWrap" hidden>Audio<select id="audioTrack"></select></label>
            <label class="cm-track" id="subtitleWrap" hidden>Sottotitoli<select id="subtitleTrack"><option value="off">Disattivati</option></select></label>
            <button id="captions" type="button" class="cm-cc" aria-pressed="false" aria-label="Sottotitoli">CC</button>
            <button id="pip" type="button" class="stroke" aria-label="Picture in Picture">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1"/></svg>
            </button>
            <button id="fullscreen" type="button" class="stroke" aria-label="Schermo intero">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
            </button>
            <button id="openDrawer" type="button" class="stroke" aria-label="Cambia sorgente">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            </button>
          </div>
        </div>
        <div class="cm-player-message" id="playerMessage" hidden>
          <p id="messageText"></p>
          <button id="messageAction" type="button" hidden></button>
        </div>
      </div>
    </div>
    <div class="cm-drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="cm-drawer" id="drawer" aria-label="Cambia sorgente" tabindex="-1">
      <div class="cm-drawer-head"><h2>Cambia sorgente</h2><button class="cm-close" id="closeDrawer" type="button" aria-label="Chiudi elenco sorgenti">×</button></div>
      <div class="cm-drawer-list" id="drawerList"></div>
    </aside>
  </section>
</main>

<div class="cm-toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="jsonFile" accept=".json,application/json" hidden>
</body>
</html>
