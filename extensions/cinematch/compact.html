<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>CineMatch · Correnti</title>
  <link rel="stylesheet" href="compact.css">
  <script type="module" src="compact.js"></script>
</head>
<body>
  <header class="cc-head">
    <div class="cc-brand"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="4" width="17" height="17" rx="4"/><path d="M9 24h12a4 4 0 0 0 4-4V9M9 10h6M9 15h4"/></svg><span>CineMatch</span></div>
    <div class="cc-head-actions">
      <button id="settings" class="cc-close" type="button" aria-label="Impostazioni CineMatch" title="Impostazioni" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="M4 12h2m12 0h2M12 4v2m0 12v2M6.3 6.3l1.4 1.4m8.6 8.6l1.4 1.4m0-11.4l-1.4 1.4M7.7 16.3l-1.4 1.4"/></svg></button>
      <button id="close" class="cc-close" type="button" aria-label="Chiudi le correnti">×</button>
    </div>
  </header>

  <div class="cc-tabs" role="tablist" aria-label="Modalità">
    <button id="tab-currents" role="tab" aria-controls="currents-view" aria-selected="true" type="button">Correnti</button>
    <button id="tab-free" role="tab" aria-controls="free-view" aria-selected="false" type="button">Richiesta libera</button>
  </div>

  <main id="currents-view" class="cc-view" role="tabpanel" aria-labelledby="tab-currents">
    <div id="chips" class="cc-chips" aria-label="Correnti scelte" hidden></div>
    <label class="cc-search-wrap"><span class="sr-only">Cerca una corrente</span><input id="search" type="search" placeholder="Cerca corrente, autore o film…" autocomplete="off"></label>
    <div id="list" class="cc-list" role="listbox" aria-label="Correnti disponibili" aria-multiselectable="true"></div>
    <p id="empty" class="cc-empty" hidden>Nessuna corrente trovata.</p>
    <details class="cc-details">
      <summary>Opzioni</summary>
      <div class="cc-options">
        <label>Obiettivo<select id="goal"></select></label>
        <label>Approfondimento<select id="depth"><option value="concise">Sintetico</option><option value="detailed">Approfondito</option></select></label>
        <label>Dettaglio per la richiesta<textarea id="current-question" rows="2" placeholder="Atmosfera, vincoli, ciò che cerchi…"></textarea></label>
        <label>Preferenze<textarea id="preferences" rows="2" placeholder="Temi, durata, atmosfera…"></textarea></label>
        <label>Da escludere<textarea id="exclusions" rows="2" placeholder="Contenuti da evitare…"></textarea></label>
        <label>Già visti<textarea id="watched" rows="2" placeholder="Un titolo per riga…"></textarea></label>
      </div>
    </details>
  </main>

  <main id="free-view" class="cc-view" role="tabpanel" aria-labelledby="tab-free" hidden>
    <label class="cc-field">La tua richiesta<textarea id="free-question" rows="4" placeholder="Scrivi la tua richiesta: che film cerchi, per quale serata, con quali atmosfere o vincoli…"></textarea></label>
    <details class="cc-details">
      <summary>Opzioni</summary>
      <div class="cc-options">
        <label>Approfondimento<select id="free-depth"><option value="concise">Sintetico</option><option value="detailed">Approfondito</option></select></label>
        <label>Preferenze<textarea id="free-preferences" rows="2" placeholder="Temi, durata, atmosfera…"></textarea></label>
        <label>Da escludere<textarea id="free-exclusions" rows="2" placeholder="Contenuti da evitare…"></textarea></label>
        <label>Già visti<textarea id="free-watched" rows="2" placeholder="Un titolo per riga…"></textarea></label>
      </div>
    </details>
  </main>

  <section id="preview-view" class="cc-view cc-preview" hidden>
    <div class="cc-preview-head"><span>Anteprima prompt</span><button id="back" type="button">Modifica</button></div>
    <textarea id="prompt-preview" rows="10" spellcheck="false" aria-label="Prompt generato"></textarea>
  </section>

  <footer class="cc-footer">
    <p id="hint" class="cc-hint" role="status"></p>
    <div id="form-actions" class="cc-actions">
      <button id="generate" class="cc-primary" type="button">Genera il prompt</button>
    </div>
    <div id="preview-actions" class="cc-actions" hidden>
      <button id="copy" type="button">Copia</button>
      <button id="insert" class="cc-primary" type="button">Inserisci nella chat</button>
    </div>
    <div id="conflict" class="cc-conflict" hidden>
      <p>La chat contiene già una bozza.</p>
      <div class="cc-actions"><button id="append" type="button">Aggiungi in fondo</button><button id="replace" type="button">Sostituisci</button></div>
      <button id="cancel-conflict" class="cc-link" type="button">Annulla</button>
    </div>
    <p id="status" class="cc-status" role="status" aria-live="polite"></p>
  </footer>
</body>
</html>
