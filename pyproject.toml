[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "termovies"
version = "0.5.0"
description = "Cinema, serie, anime, TV e correnti cinematografiche nel terminale"
requires-python = ">=3.11"
readme = "terminal/README.md"
license = "MIT"
license-files = ["terminal/LICENSE"]
dependencies = ["textual>=8.2,<9", "httpx>=0.28,<1", "platformdirs>=4.5,<5", "pyperclip>=1.9,<2"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2"]

[project.scripts]
termovies = "termovies.cli:main"

[project.urls]
Homepage = "https://emanueleparis98.github.io/termovies/"
Repository = "https://github.com/Emanueleparis98/termovies"

[tool.hatch.build.targets.wheel]
packages = ["terminal/src/termovies"]

[tool.hatch.build.targets.sdist]
include = ["/terminal", "/pyproject.toml", "/plugins/cinema-currents/assets/movements.json"]
exclude = ["terminal/dist", "terminal/.venv", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["terminal/tests"]
pythonpath = ["terminal/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
