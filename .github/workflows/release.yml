name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versione senza v (es. 3.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile

      - name: Versione
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versione non valida: '$version' (atteso x.y.z)." >&2
            exit 1
          fi
          manifest=$(python3 -c "import json;print(json.load(open('extensions/cinematch/manifest.json'))['version'])")
          if [ "$manifest" != "$version" ]; then
            echo "manifest.json contiene $manifest, il tag dice $version: allinea la versione prima della release." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build estensione
        run: python3 scripts/build-extension.py

      - name: Test Node
        run: pnpm test

      - name: Test throughput
        run: pnpm test:throughput

      - name: Installa Chromium per i test
        run: pnpm exec playwright install --with-deps chromium

      - name: Test browser
        run: pnpm test:browser

      - name: Test Correnti DeepSeek
        run: pnpm test:deepseek

      - name: Test TMDB e serie TV
        run: pnpm test:tv

      - name: Test immagini TMDB
        run: pnpm test:images

      - name: Test player
        run: pnpm test:player

      - name: Test codec
        run: pnpm test:codecs

      - name: Test modalità CB01
        run: pnpm test:cb01

      - name: Test aggiornamenti
        run: pnpm test:updater

      - name: Manifest aggiornamenti
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          version = os.environ["VERSION"]
          archive = pathlib.Path("dist") / f"CineMatch-Chrome-{version}.zip"
          data = {
              "version": version,
              "zip": archive.name,
              "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "size": archive.stat().st_size,
              "url": f"https://github.com/Emanueleparis98/cinematch/releases/download/v{version}/{archive.name}",
          }
          pathlib.Path("dist/latest.json").write_text(
              json.dumps(data, separators=(",", ":")), encoding="utf-8"
          )
          PY

      - name: Pubblica release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CineMatch ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/CineMatch-Chrome-${{ steps.version.outputs.version }}.zip
            dist/latest.json
