[package]
name = "cinematch"
version = "0.14.0"
edition = "2021"
description = "CineMatch - correnti cinematografiche e generatore di prompt"

[workspace]
members = ["plugins/cinema-currents"]
resolver = "2"

[build-dependencies]
winres = "0.1"

[features]
default = []
# Renderer wgpu/DX12 opzionale: `cargo build --release --features wgpu`.
# La build normale usa glow (OpenGL), piu leggera in memoria.
wgpu = ["eframe/wgpu"]

[dependencies]
cinema-currents = { path = "plugins/cinema-currents" }
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
] }
egui = "0.37"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }


[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
