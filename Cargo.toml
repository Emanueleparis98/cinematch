[package]
name = "cinematch"
version = "0.10.17"
edition = "2021"
description = "CineMatch - esplorazione cinematografica a vincoli con supporto AI"

[build-dependencies]
winres = "0.1"

[features]
default = []
# Renderer wgpu/DX12 opzionale: `cargo build --release --features wgpu`.
# La build normale usa glow (OpenGL), piu leggera in memoria.
wgpu = ["eframe/wgpu"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", features = ["blocking", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
