[package]
name = "cinematch"
version = "0.4.2"
edition = "2021"
description = "CineMatch - esplorazione cinematografica a vincoli con supporto AI"

[build-dependencies]
winres = "0.1"

[dependencies]
eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", features = ["blocking", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
qrcode = "0.14"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
